<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CloudCap - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,200..900&amp;family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-error": "#ffffff",
                      "on-primary-container": "#d8f0de",
                      "on-secondary-container": "#5e5548",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-fixed-variant": "#4a4538",
                      "tertiary": "#705c30",
                      "primary-fixed": "#c8e8d0",
                      "error": "#b83230",
                      "surface-variant": "#e4e0d8",
                      "surface": "#faf6f0",
                      "on-tertiary-container": "#554020",
                      "on-secondary": "#ffffff",
                      "on-error-container": "#690005",
                      "on-tertiary-fixed": "#221a05",
                      "on-surface": "#2e3230",
                      "tertiary-container": "#c4a66a",
                      "secondary-fixed-dim": "#d4ccbf",
                      "on-secondary-fixed": "#1e1a13",
                      "outline": "#74796e",
                      "surface-tint": "#4a7c59",
                      "surface-container-highest": "#e4e0d8",
                      "on-background": "#2e3230",
                      "surface-dim": "#dbd7cf",
                      "tertiary-fixed-dim": "#dcc48e",
                      "primary-fixed-dim": "#8ecf9e",
                      "inverse-surface": "#2e3230",
                      "error-container": "#ffdad8",
                      "primary": "#4a7c59",
                      "on-surface-variant": "#4a4e4a",
                      "secondary-fixed": "#f0e8db",
                      "background": "#faf6f0",
                      "primary-container": "#78a886",
                      "surface-container-high": "#eae6de",
                      "on-primary-fixed": "#002110",
                      "secondary": "#6b6358",
                      "on-primary": "#ffffff",
                      "outline-variant": "#c4c8bc",
                      "inverse-primary": "#8ecf9e",
                      "inverse-on-surface": "#f5f0e8",
                      "tertiary-fixed": "#f8e0a8",
                      "surface-bright": "#faf6f0",
                      "on-tertiary-fixed-variant": "#554020",
                      "on-primary-fixed-variant": "#2a6038",
                      "surface-container": "#f0ece4",
                      "surface-container-low": "#f5f1ea",
                      "secondary-container": "#f0e8db",
                      "on-tertiary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.5rem",
                      "lg": "1rem",
                      "xl": "1.5rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Literata"
                      ],
                      "display": [
                              "Literata"
                      ],
                      "body": [
                              "Nunito Sans"
                      ],
                      "label": [
                              "Nunito Sans"
                      ]
              },
              "fontSize": {}
            },
          },
        }
    </script>
<style>
        /* Base styles mapped to Terra typography rules */
        body {
            font-family: 'Nunito Sans', sans-serif;
            line-height: 1.6;
        }
        h1, h2, h3, h4, h5, h6, .font-headline {
            font-family: 'Literata', serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Atmospheric Organic Background -->
<div class="absolute inset-0 z-0 pointer-events-none flex justify-center items-center">
<div class="absolute top-[-10%] left-[-10%] w-[60vw] h-[60vw] bg-primary-container/10 rounded-full blur-[100px] mix-blend-multiply"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] bg-tertiary-container/10 rounded-full blur-[100px] mix-blend-multiply"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[440px] px-6 py-8 md:p-12 bg-surface rounded-[24px] border border-outline-variant/30 shadow-[0_4px_30px_rgba(46,50,48,0.08)] mx-4">
<!-- Header Branding -->
<div class="flex flex-col items-center mb-10 text-center">
<img src="/logo-small@2x.png" alt="CloudCap" class="w-16 h-16 mb-4"/>
<h1 class="font-headline font-bold text-3xl text-primary tracking-tight mb-2">CloudCap</h1>
<p class="text-on-surface-variant text-sm font-medium tracking-wide uppercase">Governance Control Plane</p>
</div>
<!-- Login Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="block text-sm font-bold text-on-surface" for="email">Work Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all" id="email" name="email" placeholder="name@enterprise.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="block text-sm font-bold text-on-surface" for="password">Password</label>
<a class="text-xs font-bold text-primary hover:text-primary-container transition-colors" href="#">Recover access</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-bold py-3.5 rounded-xl shadow-sm hover:bg-primary/90 active:scale-[0.98] transition-all flex justify-center items-center gap-2 mt-6" type="submit">
                Sign In Securely
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-7 text-on-surface-variant/60">
<hr class="flex-1 border-t border-outline-variant/30"/>
<span class="px-3 text-xs font-semibold tracking-wider uppercase">or continue with</span>
<hr class="flex-1 border-t border-outline-variant/30"/>
</div>
<!-- Secondary Action (Google) -->
<button class="w-full bg-surface-container-lowest text-on-surface font-bold py-3.5 px-4 rounded-xl border border-outline-variant/40 shadow-sm hover:bg-surface-container-low active:scale-[0.98] transition-all flex justify-center items-center gap-3" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Sign in with Google
        </button>
<!-- Footer -->
<p class="text-center mt-8 text-sm text-on-surface-variant">
            Don't have an enterprise account? <br/>
<a class="text-primary font-bold hover:underline" href="#">Request pilot access</a>
</p>
</main>
</body></html>
